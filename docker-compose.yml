version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: metaforge-backend
    ports:
      - "8000:8000"
    volumes:
      - ./workspace_model:/app/workspace_model
      - ./backend:/app/backend
    environment:
      - METAFORGE_JWT_SECRET=${METAFORGE_JWT_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - KILO_CLI_BINARY=${KILO_CLI_BINARY:-kilo}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: metaforge-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
