- name: fct_orders
  description: Enterprise Core business dataset representing Orders Fact Table. One
    atomic transaction event record per Orders Fact Table identified by (Order Key).
    Integrates source relational data from upstream Customer Dimension, Date, Customer
    Dimension, Date.
  meta:
    logical_name: Orders Fact Table
    subject_area: Core
    stereotype: FCT_TRANSACTION
    grain: One atomic transaction event record per Orders Fact Table identified by
      (Order Key).
    dbt_layer: mart
    materialized: table
    owner: Enterprise Data Architecture
    freshness_sla_hours: 24
    retention_framework: SOX_7YR
    retention_days_hot: 365
    retention_days_archive: 2555
  columns:
  - name: ORDER_KEY
    description: 'Unique primary key identifier representing the order key that uniquely
      distinguishes each individual orders fact table record. Mandatory non-nullable
      attribute with 100% data completeness observed. Standard domain values include:
      [''1'', ''2'', ''3'', ''4''].'
    meta:
      logical_name: Order Key
      pii_classification: NONE
      metadata_status: AUTO_GENERATED
      domain: Custom
    tests:
    - unique
    - not_null
  - name: ORDER_ID_NK
    description: 'Core business attribute capturing the order identifier nk for each
      orders fact table. Mandatory non-nullable attribute with 100% data completeness
      observed. Candidate natural business key with 100% distinct values observed.
      Standard domain values include: [''5001'', ''5002'', ''5003'', ''5004''].'
    meta:
      logical_name: Order Identifier Nk
      pii_classification: NONE
      metadata_status: AUTO_GENERATED
      domain: Custom
    tests:
    - not_null
  - name: CUSTOMER_KEY
    description: 'Relational foreign key reference representing the customer key linking
      this orders fact table to the associated parent customer entity. Mandatory non-nullable
      attribute with 100% data completeness observed. Candidate natural business key
      with 100% distinct values observed. Standard domain values include: [''1001'',
      ''1002'', ''1003'', ''1004''].'
    meta:
      logical_name: Customer Key
      pii_classification: NONE
      metadata_status: AUTO_GENERATED
      domain: Custom
    tests:
    - not_null
    - relationships:
        to: ref('dim_customer')
        field: CUST_ID
  - name: ORDER_DATE_KEY
    description: 'Relational foreign key reference representing the order date key
      linking this orders fact table to the associated parent date entity. Mandatory
      non-nullable attribute with 100% data completeness observed. Candidate natural
      business key with 100% distinct values observed. Standard domain values include:
      [''20250115'', ''20250122'', ''20250204'', ''20250218''].'
    meta:
      logical_name: Order Date Key
      pii_classification: NONE
      metadata_status: AUTO_GENERATED
      domain: Custom
    tests:
    - not_null
    - relationships:
        to: ref('dim_date')
        field: DATE_KEY
  - name: ORDER_STATUS_CD
    description: 'Standardized enterprise classification code categorizing the order
      status code for each orders fact table. Mandatory non-nullable attribute with
      100% data completeness observed. Standard domain values include: [''COMPLETED'',
      ''PENDING''].'
    meta:
      logical_name: Order Status Code
      pii_classification: INTERNAL
      metadata_status: AUTO_GENERATED
      domain: Custom
    tests:
    - not_null
  - name: PAYMENT_METHOD_CD
    description: 'Standardized enterprise classification code categorizing the payment
