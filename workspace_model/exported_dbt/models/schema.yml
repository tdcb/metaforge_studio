      100% data completeness observed. Standard domain values include: [''Credit Card'',
      ''Ach Transfer'', ''Wire Transfer''].'
    meta:
      logical_name: Payment Method Code
      pii_classification: INTERNAL
      metadata_status: AUTO_GENERATED
      domain: Custom
    tests:
    - not_null
  - name: SUBTOTAL_AMT
    description: 'Monetary financial measure recording the subtotal amount associated
